<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{CAMPAIGN_NAME}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;900&family=Lato:wght@400;700&display=swap">
<style>
/* Campaign page: one per campaign, one tab per step. CXL web system: teal primary, red for emphasis, beige ground, Work Sans 900 headings, Lato body. */
:root {
  --teal: #6ce5e8; --red: #d61f2c; --bg: #faf7ef; --card: #ffffff; --text: #000000; --muted: #4f4a40; --line: #e7e1d3; --soft: #f2eee3;
  --on-teal: #000000; --on-red: #ffffff; --you-bg: #000000; --you-fg: #ffffff;
  --font-heading: 'Work Sans', system-ui, sans-serif; --font-body: 'Lato', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121212; --card: #1d1d1b; --text: #f4f1ea; --muted: #b9b3a6; --line: #34322d; --soft: #24231f; --you-bg: #f4f1ea; --you-fg: #000000; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121212; --card: #1d1d1b; --text: #f4f1ea; --muted: #b9b3a6; --line: #34322d; --soft: #24231f; --you-bg: #f4f1ea; --you-fg: #000000; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 400 16px/1.55 var(--font-body); }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 64px; }
h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); line-height: 1.2; margin: 0 0 10px; text-wrap: balance; }
h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 900; }
h2 { font-size: 22px; font-weight: 900; }
h3 { font-size: 18px; font-weight: 700; margin-top: 18px; }
h4, h5, h6 { font-size: 16px; font-weight: 700; margin-top: 14px; }
p { margin: 0 0 10px; max-width: 72ch; }
a { color: inherit; text-decoration-color: var(--teal); text-decoration-thickness: 2px; }
code { font-size: 0.9em; background: var(--soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre { background: var(--soft); padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 14px; white-space: pre-wrap; }
blockquote { margin: 10px 0; padding: 8px 14px; border-left: 3px solid var(--teal); color: var(--muted); }
ul, ol { margin: 0 0 10px; padding-left: 20px; }
li { margin: 3px 0; }
li.sub { margin-left: 18px; list-style: circle; }
hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.meta { color: var(--muted); font-size: 15px; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
.stages { display: flex; gap: 4px; margin-bottom: 6px; }
.stages span { flex: 1; height: 8px; border-radius: 999px; background: var(--line); }
.stages span.done { background: var(--teal); }
.stages span.now { background: linear-gradient(90deg, var(--teal), var(--red)); }
.stage-label { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--line); margin-bottom: 22px; }
.tabs button { font: 700 15px var(--font-heading); padding: 10px 14px; border: 0; background: none; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--teal); }
.tabs button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.panel { display: none; }
.panel.active { display: block; }
.card { background: var(--card); border-radius: 12px; padding: 18px 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); margin-bottom: 16px; min-width: 0; }
.glance { border-top: 4px solid var(--teal); }
.glance ul { margin: 0; }
.lede { color: var(--muted); }
.secs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px 24px; margin-bottom: 18px; }
.sec { min-width: 0; }
.sec h3 { margin-top: 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sec:has(table) { grid-column: 1 / -1; }
.tw { overflow-x: auto; margin-bottom: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-heading); font-weight: 700; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.meta2 { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.steps { padding-left: 22px; }
.steps li { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--line); }
.steps li::marker { color: var(--muted); }
.steps li { display: list-item; }
.steps li span:first-child { margin-right: 8px; }
.steps li .pill { float: right; margin-left: 8px; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--soft); color: var(--text); white-space: nowrap; }
.pill.you { background: var(--you-bg); color: var(--you-fg); }
.pill.ship { background: var(--teal); color: var(--on-teal); }
.pill.rev { background: var(--red); color: var(--on-red); }
details { background: var(--card); border-radius: 12px; padding: 12px 18px; margin-bottom: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
summary { cursor: pointer; font-family: var(--font-heading); font-weight: 700; }
summary .pill { margin-left: 8px; }
details[open] summary { margin-bottom: 10px; }
.draftbody { min-width: 0; }
.empty { color: var(--muted); font-style: italic; margin: 0; }
footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
@media (max-width: 560px) { .tabs button { padding: 8px 10px; font-size: 14px; } th, td { padding: 6px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>{{CAMPAIGN_NAME}}</h1>
  <div class="meta">{{KPI_LINE}} · Updated {{UPDATED}}</div>
  <div class="stages" aria-hidden="true">{{STAGE_SPANS}}</div>
  <div class="stage-label">Stage: {{STAGE}}</div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="brief">Brief</button>
    <button role="tab" aria-selected="false" data-tab="channels">Channels</button>
    <button role="tab" aria-selected="false" data-tab="drafts">Drafts</button>
    <button role="tab" aria-selected="false" data-tab="review">Review</button>
    <button role="tab" aria-selected="false" data-tab="results">Results</button>
  </div>
  <section class="panel active" id="brief" role="tabpanel">{{BRIEF_PANEL}}</section>
  <section class="panel" id="channels" role="tabpanel">{{CHANNELS_PANEL}}</section>
  <section class="panel" id="drafts" role="tabpanel">{{DRAFTS_PANEL}}</section>
  <section class="panel" id="review" role="tabpanel">{{REVIEW_PANEL}}</section>
  <section class="panel" id="results" role="tabpanel">{{RESULTS_PANEL}}</section>
  <footer>Made with the CXL Campaign Engine. The files in the campaign folder are the source; this page is a view of them.</footer>
</div>
<script>
(function () {
  var tabs = document.querySelectorAll('.tabs button');
  function show(id) {
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t.dataset.tab === id ? 'true' : 'false'); });
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('active', p.id === id); });
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.tab); try { history.replaceState(null, '', '#' + t.dataset.tab); } catch (e) {} }); });
  var start = (location.hash || '').slice(1);
  if (start && document.getElementById(start)) show(start);
})();
</script>
</body>
</html>
